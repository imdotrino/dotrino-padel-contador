# Padel para iOS: la versión NATIVA de padel.dotrino.com (CONVENCIONES §16). La PWA va delante;
# MARKETING_VERSION es la versión de la PWA con la que esta está a la par (§16.3).
#
# XcodeGen → `xcodegen generate` crea Padel.xcodeproj en la Mac (el .xcodeproj no se commitea).
#
#   cd ios && xcodegen generate
#   xcodebuild -project Padel.xcodeproj -scheme Padel -destination 'platform=iOS Simulator,name=iPhone 16' test
#
# Firma: equipo DOTRINO S.A.S. (P7G853375S), automática, con los grupos compartidos del
# ecosistema (dotrino-native/docs/DISENO.md §2.1).
name: Padel
options:
  bundleIdPrefix: com.dotrino
  deploymentTarget:
    iOS: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: P7G853375S
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  # La librería nativa del ecosistema: el repo dotrino-native, como submódulo en ../native
  # (igual que Android). Almacén, idioma y la barra compartida.
  DotrinoNative:
    path: ../native
targets:
  Padel:
    type: application
    platform: iOS
    sources: [Padel]
    dependencies:
      - package: DotrinoNative
        product: DotrinoNative
      - package: DotrinoNative
        product: DotrinoNativeUI
    info:
      path: Padel/Info.plist
      properties:
        CFBundleDisplayName: Padel
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
    entitlements:
      path: Padel/Padel.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.dotrino.shared"]
        com.apple.security.application-groups: [group.com.dotrino]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dotrino.padel
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PadelTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PadelTests]
    dependencies:
      - target: Padel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Padel.app/Padel"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Padel:
    build:
      targets:
        Padel: all
    test:
      targets: [PadelTests]
