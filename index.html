<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Padel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Padel — scoreboard and tournaments</title>
<meta name="description" content="Padel scoreboard and tournaments: tap scoring with games, sets, tie-break and golden point, plus round-robin tournaments with rotating or fixed partners, rests in turns and a live table." />
<link rel="canonical" href="https://padel.dotrino.com/" />
<meta property="og:type" content="website" />
<meta property="og:locale" content="en_US" />
<meta property="og:locale:alternate" content="es_ES" />
<meta property="og:site_name" content="Dotrino" />
<meta property="og:title" content="Padel — scoreboard and tournaments" />
<meta property="og:description" content="Touch scoreboard for padel and tournaments with rotating or fixed partners, rests in turns and a live table." />
<meta property="og:url" content="https://padel.dotrino.com/" />
<meta property="og:image" content="https://padel.dotrino.com/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Padel — scoreboard and tournaments" />
<meta name="twitter:description" content="Touch scoreboard for padel and tournaments with rotating or fixed partners, rests in turns and a live table." />
<meta name="twitter:image" content="https://padel.dotrino.com/og.jpg" />
<!-- Analítica cookieless autohosteada (GoatCounter); no cuenta en localhost/LAN. -->
<script>window.goatcounter={path:function(p){return location.hostname+p}}</script>
<script data-goatcounter="https://goat.dotrino.com/count" async src="https://goat.dotrino.com/count.js"></script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Padel — scoreboard and tournaments",
  "url": "https://padel.dotrino.com/",
  "description": "Padel scoreboard and tournaments with rotating or fixed partners: points, games, sets and tie-break, rounds, rests in turns and a live table.",
  "applicationCategory": "SportsApplication",
  "operatingSystem": "Web",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "publisher": { "@type": "Organization", "name": "Dotrino", "url": "https://dotrino.com/" }
}
</script>
</head>
<body>

  <dotrino-topbar brand="Padel" icon="./icon.svg"
    support-repo="imdotrino/dotrino-padel-contador"
    support-discord="https://discord.gg/D648uq7cth"
    profile>
    <button id="btnResults" class="tb-action" data-i18n="results" data-testid="results-btn">📋 Results</button>
    <button id="btnOptions" class="tb-action tb-icon" data-i18n-title="optionsTitle" data-i18n-aria="optionsTitle" data-testid="options-btn">☰</button>
    <dotrino-install slot="end" class="cc-install sm"></dotrino-install>
  </dotrino-topbar>

  <nav class="tabs" role="tablist" data-i18n-aria="tabsAria">
    <button class="tab" role="tab" id="tab-score" aria-controls="view-score" data-i18n="tabScore" data-testid="tab-score">Score</button>
    <button class="tab" role="tab" id="tab-matches" aria-controls="view-matches" data-i18n="tabMatches" data-testid="tab-matches">Matches</button>
    <button class="tab" role="tab" id="tab-table" aria-controls="view-table" data-i18n="tabTable" data-testid="tab-table">Table</button>
    <button class="tab" role="tab" id="tab-setup" aria-controls="view-setup" data-i18n="tabSetup" data-testid="tab-setup">Tournament</button>
  </nav>

  <section class="view view-score" id="view-score" role="tabpanel" aria-labelledby="tab-score">
    <div class="linked-bar" id="linkedBar" hidden>
      <span class="linked-label" id="linkedLabel" data-testid="linked-label"></span>
      <button class="linked-leave" id="btnLeaveLinked" data-i18n-aria="leaveLinked" data-i18n-title="leaveLinked" data-testid="leave-linked">✕</button>
    </div>
    <div class="board">
      <div class="team left" id="teamLeft" data-testid="team-left">
        <div class="name-wrap">
          <input class="name" id="nameLeft" maxlength="32" readonly data-testid="name-left">
          <button class="edit-name" data-target="nameLeft" data-i18n-title="editName" data-i18n-aria="editName">✎</button>
        </div>
        <div class="meta" id="metaLeft"></div>
        <div class="points" id="pointsLeft" data-testid="points-left">0</div>
        <div class="points-adj" id="pointsAdjLeft"></div>
        <div class="serve-label" id="serveLeft"></div>
        <div class="tie-badge">TIE-BREAK</div>
        <div class="tap-pop" id="popLeft">+1</div>
      </div>
      <div class="team right" id="teamRight" data-testid="team-right">
        <div class="name-wrap">
          <input class="name" id="nameRight" maxlength="32" readonly data-testid="name-right">
          <button class="edit-name" data-target="nameRight" data-i18n-title="editName" data-i18n-aria="editName">✎</button>
        </div>
        <div class="meta" id="metaRight"></div>
        <div class="points" id="pointsRight" data-testid="points-right">0</div>
        <div class="points-adj" id="pointsAdjRight"></div>
        <div class="serve-label" id="serveRight"></div>
        <div class="tie-badge">TIE-BREAK</div>
        <div class="tap-pop" id="popRight">+1</div>
      </div>
      <div class="serve-court" id="serveCourt"></div>
    </div>
    <div class="controls">
      <button id="btnUndo" data-i18n="undo" data-testid="undo">↶ Undo</button>
      <button class="btn-serve" id="btnServe" data-i18n="serveBtn" data-testid="serve">⇄ Serve</button>
      <button id="btnNew" data-testid="new-match">+ New</button>
    </div>
  </section>

  <section class="view view-scroll" id="view-matches" role="tabpanel" aria-labelledby="tab-matches" hidden>
    <div class="page" id="matchesPage"></div>
  </section>
  <section class="view view-scroll" id="view-table" role="tabpanel" aria-labelledby="tab-table" hidden>
    <div class="page" id="tablePage"></div>
  </section>
  <section class="view view-scroll" id="view-setup" role="tabpanel" aria-labelledby="tab-setup" hidden>
    <div class="page" id="setupPage"></div>
  </section>

  <div class="modal" id="modalResults">
    <div class="modal-box">
      <div class="modal-head">
        <h2 data-i18n="resultsH">Results</h2>
        <button class="modal-close" id="btnCloseResults" data-i18n-aria="close">✕</button>
      </div>
      <div class="modal-body" id="resultsList"></div>
    </div>
  </div>

  <div class="modal" id="modalOptions">
    <div class="modal-box">
      <div class="modal-head">
        <h2 data-i18n="optionsH">Options</h2>
        <button class="modal-close" id="btnCloseOptions" data-i18n-aria="close">✕</button>
      </div>
      <div class="modal-body">
        <div class="option">
          <div class="option-label" data-i18n="matchSets">Match sets</div>
          <div class="option-desc" id="setsDesc"></div>
          <div class="seg" id="setsGroup" role="group" data-i18n-aria="matchSets">
            <button type="button" class="seg-btn" data-sets="1">1</button>
            <button type="button" class="seg-btn" data-sets="3">3</button>
            <button type="button" class="seg-btn" data-sets="5">5</button>
          </div>
        </div>
        <div class="option">
          <div class="option-label" data-i18n="scoringMode">Scoring mode</div>
          <div class="option-desc" id="scoringDesc"></div>
          <div class="seg" id="scoringGroup" role="group" data-i18n-aria="scoringMode">
            <button type="button" class="seg-btn" data-scoring="advantage" data-i18n="advantage">Advantage</button>
            <button type="button" class="seg-btn" data-scoring="star" data-i18n="doubleAdv">Double advantage</button>
            <button type="button" class="seg-btn" data-scoring="golden" data-i18n="golden">Golden point</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="modalDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <div class="modal-box dialog">
      <div class="dialog-body">
        <h2 id="dialogTitle"></h2>
        <p id="dialogText"></p>
      </div>
      <div class="dialog-actions">
        <button class="btn" id="dialogCancel" data-testid="dialog-cancel"></button>
        <button class="btn-primary" id="dialogOk" data-testid="dialog-ok"></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
